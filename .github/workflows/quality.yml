name: Portfolio quality checks

on:
  push:
    branches:
      - main
      - mega-update
      - phase-2-intro-login
      - phase-3-dashboard-shell
      - phase-4-profile-dashboard
      - phase-4/ztrace-identity
      - phase-5/verified-certificate
      - phase-6/cyber-noir-unification
      - phase-7/production-qa
      - phase-5-learning-sections
      - phase-6-gallery-contact-motion
      - redesign/ztrace-premium-portfolio
      - feat/phantom-signal-cinematic-20261106
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-phantom-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble original Phantom Signal portrait
        run: node scripts/assemble-phantom-asset.cjs
      - name: Commit the assembled portrait asset
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add original Phantom Signal portrait asset"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "Portrait asset already assembled; no commit needed."
          fi

  validate:
    needs: [prepare-phantom-asset]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CSS parser
        run: npm install --no-save --package-lock=false postcss@8.5.6
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done
      - name: Run foundation component and data checks
        run: node tests/foundation-check.cjs
      - name: Run Phase 2 HUD gate checks
        run: node tests/phase2-gate-check.cjs
      - name: Run Phase 3 dashboard shell checks
        run: node --experimental-vm-modules tests/phase3-shell-check.cjs
      - name: Run Phase 4 Profile and Dashboard view checks
        run: node --experimental-vm-modules tests/phase4-views-check.cjs
      - name: Run Phase 5 remaining-view regression checks
        run: node --experimental-vm-modules tests/phase5-views-check.cjs
      - name: Run Phase 6 Gallery, Contact, and motion checks
        run: node --experimental-vm-modules tests/phase6-views-check.cjs
      - name: Run static SEO, link, accessibility, contrast, and asset checks
        run: node tests/qa-check.cjs
      - name: Run Phase 7 production source checks
        run: node tests/phase7-production-check.cjs
      - name: Run interaction and accessibility-state tests
        run: node --experimental-vm-modules tests/interaction-check.cjs


  visual-qa:
    needs: [prepare-phantom-asset]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout redesign source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Axe accessibility engine
        run: npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run local rendered visual QA
        run: node tests/visual-qa.cjs
      - name: Upload visual QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztrace-visual-qa
          path: artifacts/visual-qa/
          if-no-files-found: warn
          retention-days: 7


  performance-qa:
    needs: [prepare-phantom-asset]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout redesign source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned Playwright and Lighthouse
        run: npm install --no-save --package-lock=false playwright@1.56.1 lighthouse@12.8.2
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Start safe local preview
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ztrace-preview.log 2>&1 < /dev/null &
          echo $! > /tmp/ztrace-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ztrace-preview.log
          exit 1
      - name: Measure desktop first-load performance
        run: |
          mkdir -p artifacts/performance
          CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          ./node_modules/.bin/lighthouse http://127.0.0.1:4173/ \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html \
            --output-path=artifacts/performance/lighthouse-desktop \
            --quiet
      - name: Measure mobile first-load performance
        run: |
          CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          ./node_modules/.bin/lighthouse http://127.0.0.1:4173/ \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html \
            --output-path=artifacts/performance/lighthouse-mobile \
            --quiet
      - name: Validate Lighthouse reports and summarize scores
        if: always()
        run: node tests/lighthouse-report-check.cjs artifacts/performance
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztrace-lighthouse-reports
          path: artifacts/performance/
          if-no-files-found: warn
          retention-days: 7


  live-deployment-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, visual-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify the actual GitHub Pages deployment
        env:
          PORTFOLIO_ORIGIN: https://ztrace054-x.github.io/my-portfolio/
        run: node tests/live-deployment-check.cjs
      - name: Upload live website screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-signal-live-deployment
          path: artifacts/live-deployment/
          if-no-files-found: warn
          retention-days: 30
